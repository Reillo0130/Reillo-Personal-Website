<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加载页展示版</title>
    <style>
        :root {
            color-scheme: light;
            --bg-1: #f3f6fb;
            --bg-2: #e7edf7;
            --bg-3: #fbfcfe;
            --text: #1d2433;
            --muted: #667084;
            --accent: #4b84d8;
            --accent-2: #8ab1e4;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            background-color: #e7edf7;
            background:
                linear-gradient(rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0.30)),
                url("assets/bg.webp") center center / cover no-repeat fixed,
                radial-gradient(circle at 18% 20%, rgba(138, 177, 228, 0.14), transparent 28%),
                radial-gradient(circle at 82% 16%, rgba(75, 132, 216, 0.10), transparent 26%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
        }

        body {
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("assets/bg.webp");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            filter: blur(5px);
            transform: scale(1.05);
            transform-origin: center;
            pointer-events: none;
            z-index: 0;
            will-change: transform, filter;
            contain: layout paint;
        }

        .preview-stage {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .preview-card {
            max-width: 100%;
            width: 70%;
            min-width: 200px;
            margin: 0 auto;
            padding: 26px 0 32px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.62);
            box-shadow: 0 18px 44px rgba(17, 24, 39, 0.12);
            backdrop-filter: blur(12px) saturate(118%);
            -webkit-backdrop-filter: blur(12px) saturate(118%);
            opacity: 0;
            animation: preview-card-fade 0.45s ease forwards;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-align: center;
        }

        .title {
            margin: 0;
            color: var(--text);
            font-size: 27px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.01em;
        }

        .subtext {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.75;
            text-align: center;
        }

        .progress-wrap {
            margin: 24px auto 0;
            width: 80%;
            opacity: 0;
            transform: translateY(6px);
            animation: loader-progress-fade 0.45s ease 0.12s forwards;
        }

        .progress-track {
            width: 100%;
            height: 9px;
            border-radius: 999px;
            background: rgba(228, 234, 242, 0.64);
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(31, 41, 55, 0.05);
        }

        .progress-fill {
            width: 62%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(75, 132, 216, 0.78), rgba(138, 177, 228, 0.72));
            box-shadow: 0 6px 14px rgba(75, 132, 216, 0.08);
            background-color: #e7edf7; /* 页面背景色与主背景一致，避免闪白 */
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 9px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.04em;
        }

        .footer-note {
            margin-top: 16px;
            text-align: center;
            color: #7a8494;
            font-size: 12px;
            letter-spacing: 0.04em;
        }

        @keyframes preview-card-fade {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loader-progress-fade {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .preview-card {
                width: 90%;
                padding: 22px 0 28px;
                border-radius: 22px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="preview-stage">
        <section class="preview-card" aria-label="加载页展示版">
            <p class="eyebrow">LOADING</p>
            <h1 class="title">加载中</h1>
            <p class="subtext">正在准备首页内容与资源，请稍候。</p>

            <div class="progress-wrap" aria-label="加载进度">
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-meta">
                    <span>正在加载</span>
                    <span>62%</span>
                </div>
            </div>

            <div class="footer-note">这是展示版预览，未接入首页。</div>
        </section>
    </main>
</body>
</html>
