<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<title>页面不存在 - 雷洛Reillo</title>
	<link rel="stylesheet" href="css/loader.css">
	<link rel="stylesheet" href="css/404.css">
	<script src="js/loader-container.js"></script>
</head>
<body>
	<div class="loader-container">
		<div class="loader-panel" aria-label="加载页">
			<p class="loader-eyebrow">LOADING</p>
			<h1 class="loader-title">加载中</h1>
			<p class="loader-subtext">正在准备错误页内容与资源，请稍候。</p>

			<div class="loader-progress-wrap" aria-label="加载进度">
				<div class="loader-progress-track">
					<div class="loader-progress-fill"></div>
				</div>
				<div class="loader-progress-meta">
					<span>正在加载</span>
					<span>62%</span>
				</div>
			</div>

			<div class="loader-footer-note">正在进入错误页</div>
		</div>
	</div>

	<main class="page-shell">
		<nav class="glass-nav" aria-label="错误页导航">
			<span class="brand">雷洛Reillo</span>
			<a class="nav-link" href="index.html">返回首页</a>
		</nav>

		<section class="error-card" aria-labelledby="error-title">
			<p><p class="error-code" aria-hidden="true">404</p></p>
			<h1 id="error-title">这个页面走丢了</h1>
			<p>你访问的页面不存在，或者已经被移动到其他地方。</p>
			<div class="actions">
				<a class="action-link primary" href="index.html">回到主页</a>
				<a class="action-link" href="changelog.html">查看更新日志</a>
			</div>
		</section>
	</main>
</body>
</html>
